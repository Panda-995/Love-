name: love-home

services:
  app:
    image: ghcr.io/panda-995/love-app:latest
    container_name: love-home-app
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      NUXT_AI_API_KEY: "${AI_API_KEY:-}"
      NUXT_AI_BASE_URL: "${AI_BASE_URL:-https://api.openai.com/v1}"
      NUXT_AI_MODEL: "${AI_MODEL:-}"
      NUXT_AMAP_KEY: "${AMAP_KEY:-}"
      NUXT_AMAP_SECURITY_CODE: "${AMAP_SECURITY_CODE:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  coturn:
    image: ghcr.io/panda-995/love-coturn:latest
    container_name: love-home-coturn
    restart: unless-stopped
    init: true
    network_mode: host
    depends_on:
      - app
    volumes:
      - ./data:/data:ro
